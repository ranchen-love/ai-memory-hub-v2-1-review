[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-hub"
version = "2.4.0"
description = "Local, platform-neutral memory workspace and Vault"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ai-memory-hub = "ai_memory_hub.__main__:main"

[tool.setuptools]
packages = ["ai_memory_hub"]

[tool.setuptools.package-data]
ai_memory_hub = ["workspace-files.json"]
