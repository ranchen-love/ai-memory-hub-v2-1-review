[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-hub"
version = "2.2.0"
description = "Local, platform-neutral AI context and asset management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ai-memory-hub = "ai_memory_hub.__main__:main"

[tool.setuptools]
packages = ["ai_memory_hub"]
